apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-image-registry
spec:
  steps:
    - name: check
      image: quay.io/openshift/origin-cli:latest
      script: |
        #!/usr/bin/env bash
        set -e

        echo "Checking Image Registry configuration..."

        MANAGEMENT_STATE=$(oc get configs.imageregistry.operator.openshift.io cluster \
          -o jsonpath='{.spec.managementState}')

        if [ "$MANAGEMENT_STATE" != "Managed" ]; then
          echo "Image Registry is not Managed."
          exit 1
        fi

        STORAGE=$(oc get configs.imageregistry.operator.openshift.io cluster \
          -o jsonpath='{.spec.storage}')

        if [ -z "$STORAGE" ] || [ "$STORAGE" = "{}" ]; then
          echo "Image Registry storage is not configured."
          exit 1
        fi

        echo "Checking Image Registry..."

        AVAILABLE=$(oc get clusteroperator image-registry \
          -o jsonpath='{.status.conditions[?(@.type=="Available")].status}')

        if [ "$AVAILABLE" != "True" ]; then
          echo "Image Registry is not available."
          exit 1
        fi

        echo "Image Registry is available."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-postgres
spec:
  steps:
    - name: deploy-and-wait
      image: quay.io/openshift/origin-cli:latest
      script: |
        #!/usr/bin/env bash
        set -e

        echo "Deploying PostgreSQL..."
        oc apply -f https://raw.githubusercontent.com/khalidrizki/counter-docker-k8/refs/heads/operator-connected/openshift/postgres-cnpg.yaml

        echo "Waiting for PostgreSQL cluster to be ready..."
        oc wait cluster/cnpg-ha \
          --for=condition=Ready \
          --timeout=10m

        echo "PostgreSQL is ready."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-backend
spec:
  steps:
    - name: create-imagestream
      image: quay.io/openshift/origin-cli:latest
      script: |
        #!/usr/bin/env bash
        set -e

        echo "Creating backend ImageStream..."

        oc create imagestream backend \
          --dry-run=client -o yaml | oc apply -f -

        echo "Backend ImageStream is ready."

    - name: apply-buildconfig
      image: quay.io/openshift/origin-cli:latest
      script: |
        #!/usr/bin/env bash
        set -e

        echo "Creating/updating backend BuildConfig..."

        oc apply -f https://raw.githubusercontent.com/khalidrizki/counter-docker-k8/refs/heads/operator-connected/openshift/backend-buildconfig.yaml

    - name: build
      image: quay.io/openshift/origin-cli:latest
      script: |
        #!/usr/bin/env bash
        set -e

        echo "Starting backend build..."

        oc start-build backend --wait

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-backend
spec:
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:latest
      script: |
        #!/usr/bin/env bash
        set -e

        oc apply -f https://raw.githubusercontent.com/khalidrizki/counter-docker-k8/refs/heads/operator-connected/openshift/backend.yaml

        echo "Waiting for backend rollout..."

        oc rollout status deployment/backend --timeout=10m

