apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend
spec: 
  replicas: 3
  selector: 
    matchLabels: 
      app: backend
  template: 
    metadata: 
      labels: 
        app: backend
    spec: 
      containers: 
        - name: backend
          image: image-registry.openshift-image-registry.svc:5000/counter-app/backend:latest
          ports: 
            - containerPort: 8080

          env: 
            - name: DB_USER 
              valueFrom: 
                secretKeyRef: 
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom: 
                secretKeyRef: 
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME 
              valueFrom: 
                secretKeyRef: 
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec: 
  selector: 
    app: backend
  ports: 
    - port: 8080
      targetPort: 8080