apiVersion: v1
kind: ConfigMap

metadata:
  name: postgres-primary-config

data:
  pg_hba.conf: |
    local   all             all                                     trust

    host    all             all             0.0.0.0/0               scram-sha-256

    host    replication     replicator      0.0.0.0/0               scram-sha-256
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-create-replication-user.sh: |
    #!/bin/bash
    set -e

    psql -v ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" <<-EOSQL

        CREATE ROLE ${REPLICATION_USER}
        WITH REPLICATION
        LOGIN
        PASSWORD '${REPLICATION_PASSWORD}';

    EOSQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-primary-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ocs-storagecluster-ceph-rbd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
spec:
  selector: 
    app: postgres-primary
  ports: 
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-primary

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-primary

  template:
    metadata:
      labels:
        app: postgres-primary

    spec:
      containers:
        - name: postgres

          image: postgres:16

          ports:
            - containerPort: 5432

          env:

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: REPLICATION_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: REPLICATION_USER

            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: REPLICATION_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          args:
            - "-c"
            - "wal_level=replica"

            - "-c"
            - "max_wal_senders=10"

            - "-c"
            - "max_replication_slots=10"

            - "-c"
            - "hba_file=/etc/postgresql/pg_hba.conf"

          volumeMounts:

            - name: postgres-primary-storage
              mountPath: /var/lib/postgresql/data

            - name: postgres-primary-config
              mountPath: /etc/postgresql

            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d

      volumes:

        - name: postgres-primary-storage
          persistentVolumeClaim:
            claimName: postgres-primary-pvc

        - name: postgres-primary-config
          configMap:
            name: postgres-primary-config

        - name: postgres-init
          configMap:
            name: postgres-init
            defaultMode: 0755